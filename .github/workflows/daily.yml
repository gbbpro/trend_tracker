name: Daily trend scan

on:
  schedule:
    - cron: "23 13 * * *"   # every day at 13:23 UTC (6:23 am Denver standard time, 7:23 am daylight time)
  workflow_dispatch:         # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write            # lets the job commit the report and history back to the repo
  pages: write               # publish the reports to GitHub Pages
  id-token: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run trendnamer
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          DAY=$(date -u +%F)
          mkdir -p reports snapshots
          python trendnamer.py --out "reports/$DAY" --save-snapshot "snapshots/$DAY.json" | tee "reports/$DAY.txt"
          cp "reports/$DAY.csv" reports/latest.csv
          cp "reports/$DAY.html" reports/latest.html

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add history.json reports snapshots
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Daily scan $(date -u +%F)"
            git push
          fi

      - name: Build Pages site
        run: |
          mkdir -p site && cp -r reports site/
          python - <<'PY'
          import pathlib, html
          days = sorted((p.stem for p in pathlib.Path("reports").glob("20*.html")), reverse=True)
          rows = "".join(f'<li><a href="reports/{d}.html">{d}</a> · <a href="reports/{d}.csv">csv</a></li>' for d in days)
          pathlib.Path("site/index.html").write_text(f"""<!DOCTYPE html><html><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width"><title>trend_tracker</title>
          <style>body{{font:16px/1.6 system-ui;max-width:640px;margin:3rem auto;padding:0 1rem}}</style></head>
          <body><h1>trend_tracker</h1><p><a href="reports/latest.html"><b>Latest report →</b></a></p>
          <h2>All days</h2><ul>{rows}</ul></body></html>""")
          PY
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
